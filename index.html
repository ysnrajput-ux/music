<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>YSN MUSIC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ff99">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
      border-color: rgba(0, 255, 153, 0.3);
    }

    .sidebar {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(17, 17, 17, 0.95);
      backdrop-filter: blur(20px);
      z-index: 999;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #888;
      transition: color 0.2s;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: #00ff99;
    }

    .nav-icon {
      font-size: 22px;
      font-weight: 500;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 153, 0.3);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 255, 153, 0.5);
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .loading {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @media (min-width: 768px) {
      .main-content {
        margin-left: 280px;
      }
      
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 280px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      .bottom-nav {
        display: none;
      }
      
      .desktop-player {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 400px;
      }
    }

    @media (max-width: 767px) {
      .sidebar {
        display: none;
      }
      
      .desktop-player {
        position: fixed;
        bottom: 80px;
        left: 12px;
        right: 12px;
      }
    }

    .search-button {
      background: linear-gradient(135deg, #00ff99 0%, #00cc7a 100%);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .search-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3);
    }

    .play-button {
      background: linear-gradient(135deg, #00ff99 0%, #00cc7a 100%);
      transition: transform 0.2s;
    }

    .play-button:hover {
      transform: scale(1.05);
    }

    input:focus {
      outline: none;
      border-color: #00ff99;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    @media (min-width: 1024px) {
      .song-grid {
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      }
    }
  </style>
</head>
<body>

<div class="flex">
  <!-- Sidebar for PC -->
  <div class="sidebar p-6">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-green-400 mb-2">YSN MUSIC</h1>
      <p class="text-gray-400 text-sm">Discover and stream music</p>
    </div>
    
    <div class="space-y-4">
      <button class="nav-item active w-full text-left flex flex-row gap-3 items-center px-4 py-3 rounded-xl hover:bg-white/5 transition">
        <span class="nav-icon">♪</span>
        <span>Discover</span>
      </button>
      <button class="nav-item w-full text-left flex flex-row gap-3 items-center px-4 py-3 rounded-xl hover:bg-white/5 transition">
        <span class="nav-icon">♫</span>
        <span>Library</span>
      </button>
      <button class="nav-item w-full text-left flex flex-row gap-3 items-center px-4 py-3 rounded-xl hover:bg-white/5 transition">
        <span class="nav-icon">↓</span>
        <span>Downloads</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content flex-1 min-h-screen">
    <header class="glass p-6 sticky top-0 z-50">
      <h1 class="text-3xl font-bold text-green-400 md:hidden">YSN MUSIC</h1>
      <p class="text-gray-400 mt-1 hidden md:block">Discover the best music from around the world</p>
    </header>

    <div class="p-6">
      <!-- Search Section -->
      <div class="flex gap-3 mb-8">
        <input
          id="searchInput"
          placeholder="Search songs, artists, or albums..."
          class="flex-1 p-4 rounded-xl glass outline-none text-white placeholder-gray-400"
          autocomplete="off"
        />
        <button
          id="searchButton"
          class="search-button px-8 rounded-xl font-semibold text-black transition"
        >
          Search
        </button>
      </div>

      <!-- Results Section -->
      <div id="songList" class="song-grid pb-32"></div>
      
      <!-- Loading State -->
      <div id="loadingState" class="hidden text-center py-20">
        <div class="inline-block w-12 h-12 border-4 border-green-400 border-t-transparent rounded-full loading"></div>
        <p class="text-gray-400 mt-4">Loading songs...</p>
      </div>
      
      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-20">
        <p class="text-gray-400 text-lg">No songs found</p>
        <p class="text-gray-500 text-sm mt-2">Try searching for something else</p>
      </div>
    </div>
  </div>
</div>

<!-- Mini Player (Mobile) -->
<div
  id="miniPlayer"
  class="hidden desktop-player glass-card p-4 rounded-xl items-center gap-3 z-50 shadow-2xl"
>
  <img
    id="miniCover"
    class="w-14 h-14 rounded-lg object-cover"
    alt="Album art"
  />
  <div class="flex-1 overflow-hidden">
    <h2 id="miniTitle" class="font-semibold truncate text-white">Title</h2>
    <p id="miniArtist" class="text-gray-400 text-sm truncate">Artist</p>
  </div>
  <div class="flex gap-2">
    <button id="playPauseBtn" class="play-button w-10 h-10 rounded-full text-black font-bold flex items-center justify-center">
      ▶
    </button>
    <button id="closePlayerBtn" class="w-10 h-10 rounded-full bg-white/10 text-white hover:bg-white/20 transition">
      ✕
    </button>
  </div>
</div>

<!-- Bottom Navigation (Mobile) -->
<nav class="bottom-nav md:hidden">
  <button class="nav-item active">
    <span class="nav-icon">♪</span>
    <span>Home</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">♫</span>
    <span>Songs</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">↓</span>
    <span>Library</span>
  </button>
</nav>

<audio id="audio" preload="metadata"></audio>

<script src="app.js"></script>
</body>
</html>
